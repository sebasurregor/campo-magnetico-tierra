name: Compilar APK

# Solo en push a main (o a mano). Nunca en pull requests, así que tampoco en PRs de forks.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos por defecto: solo lectura del repositorio.
permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Pruebas, compilación y verificación
    # No se ejecuta en copias (forks) del repositorio.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools build-tools;36.0.0'

      - name: Instalar Gradle 9.6.1
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.6.1'
          # Caché de código abierto basada en GitHub Actions (sin el servicio comercial).
          cache-provider: basic

      - name: Pruebas unitarias y APK de debug
        run: gradle test assembleDebug

      - name: Verificar permisos y componentes del APK
        run: python3 .github/scripts/verificar_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Calcular SHA-256
        id: hash
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk | tee app-debug.apk.sha256
          echo "sha256=$(cut -d' ' -f1 app-debug.apk.sha256)" >> "$GITHUB_OUTPUT"
          echo "### SHA-256 de app-debug.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(cut -d' ' -f1 app-debug.apk.sha256)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Subir APK como artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar Release "latest"
    needs: build
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Único job con permiso de escritura: crear el Release.
    permissions:
      contents: write
    steps:
      - name: Descargar APK compilado
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-debug
          path: dist

      - name: Publicar o actualizar el Release
        env:
          # Token temporal que GitHub crea para esta ejecución (no es un secreto del repositorio).
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          echo "${APK_SHA256}  dist/app-debug.apk" | sha256sum --check
          {
            echo "APK de depuración compilado automáticamente desde el commit ${GITHUB_SHA}."
            echo
            echo "**SHA-256 de \`app-debug.apk\`:**"
            echo
            echo "\`${APK_SHA256}\`"
            echo
            echo "Permisos verificados en la compilación: solo \`android.permission.ACCESS_COARSE_LOCATION\`. Sin acceso a internet."
            echo
            echo "Para comprobar el hash en Windows: \`certutil -hashfile app-debug.apk SHA256\`"
          } > notes.md
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/app-debug.apk dist/app-debug.apk.sha256 \
            --title "Última versión (debug)" \
            --notes-file notes.md \
            --target "${GITHUB_SHA}" \
            --latest
